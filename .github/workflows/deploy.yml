# Deploys everything on every push to main, in the order that keeps the site working:
# checks → game server (Cloudflare Worker, cards-api.martykokes.com) → web app
# (GitHub Pages, cards.martykokes.com). New web code can rely on new server code
# because the server is always live first.
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (see README → Deploying).
#
# Actions are pinned to full commit SHAs (tags can be moved); the comment gives the
# release. Each job gets only the permissions it needs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Check, build web app, deploy game server
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm format:check && pnpm typecheck && pnpm test
      # Build before deploying anything, so a broken web build can't leave a new
      # server live behind the old web app.
      - name: Build web app
        run: pnpm --filter @marriage/web build
        env:
          VITE_GAME_HOST: cards-api.martykokes.com
      - name: Deploy game server
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  web:
    name: Publish web app
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
